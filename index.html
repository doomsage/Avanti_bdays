<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="manifest" href="/manifest.json">
  <title>Avanti B'days</title>
  <style>
    body { background-color: #121212; color: #00ffcc; font-family: monospace; padding: 20px; }
    input, button { padding: 10px; margin: 10px 0; background: #222; color: #fff; border: 1px solid #00ffcc; width: 100%; box-sizing: border-box;}
  </style>
  <script>
    // Ye code instantly event pakdega, bina app.js ka wait kiye
    let deferredPrompt;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      const installBtn = document.getElementById('install-btn');
      if (installBtn) installBtn.style.display = 'block';
    });
  </script>
</head>
<body>
  <h2>Avanti Batch Birthdays</h2>
    <!-- PWA DEBUGGER BOX -->
  <div id="debug-box" style="margin: 10px 0; padding: 10px; background: #333; color: #ffeb3b; border: 1px dashed red; font-size: 14px;">
    <b>PWA Diagnostic:</b><br>
    <span id="log-sw">SW Status: Checking...</span><br>
    <span id="log-event">Install Event: Waiting...</span>
  </div>

  <script>
    // 1. Check if Service Worker is actually alive
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(regs => {
        if(regs.length > 0) {
          document.getElementById('log-sw').innerHTML = "SW Status: Active & Ready ✅";
        } else {
          document.getElementById('log-sw').innerHTML = "SW Status: Missing/Dead ❌";
        }
      });
    } else {
      document.getElementById('log-sw').innerHTML = "SW Status: Browser Not Supported ❌";
    }

    // 2. Track the exact moment Chrome decides to fire the event
    window.addEventListener('beforeinstallprompt', (e) => {
      document.getElementById('log-event').innerHTML = "Install Event: FIRED! ✅";
    });
  </script>
  
  <button id="enable-notifications">Enable Daily Notifications</button>
  <button id="install-btn" style="display: none; background: #00ffcc; color: #000; font-weight: bold;">Install App in Phone</button>
  
  <br><br>
  <input type="text" id="search" placeholder="Search name (e.g. Lokesh)">
  <div id="results"></div>

  <script>
    // Install button click logic
    document.getElementById('install-btn').addEventListener('click', async () => {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        if (outcome === 'accepted') {
          document.getElementById('install-btn').style.display = 'none'; 
        }
        deferredPrompt = null;
      }
    });
  </script>
  
  <script type="module" src="/app.js"></script>
</body>
</html>
